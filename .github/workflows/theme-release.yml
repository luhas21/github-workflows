name: Reusable Theme Release

on:
  workflow_call:
    secrets:
      SSH_PRIVATE_KEY:
        required: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-artifact:
    name: Build development artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Load theme config
        run: |
          set -a
          source .github/theme.config
          set +a

          : "${THEME_SLUG:?THEME_SLUG is required}"
          : "${THEME_FOLDER:=$THEME_SLUG}"
          : "${THEME_MAIN_FILE:=style.css}"

          echo "THEME_SLUG=$THEME_SLUG" >> "$GITHUB_ENV"
          echo "THEME_FOLDER=$THEME_FOLDER" >> "$GITHUB_ENV"
          echo "THEME_MAIN_FILE=$THEME_MAIN_FILE" >> "$GITHUB_ENV"

      - name: Get current version
        run: |
          CURRENT_VERSION=$(grep -m1 '^Version:' "$THEME_MAIN_FILE" | grep -oP '\d+\.\d+\.\d+')

          if [ -z "$CURRENT_VERSION" ]; then
            echo "No version found in $THEME_MAIN_FILE"
            exit 1
          fi

          echo "CURRENT_VERSION=$CURRENT_VERSION" >> "$GITHUB_ENV"

      - name: Sanitize branch name
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          BRANCH_SANITIZED=$(echo "$BRANCH_NAME" | tr '/' '-')
          echo "BRANCH_SANITIZED=$BRANCH_SANITIZED" >> "$GITHUB_ENV"

      - name: Build development ZIP
        run: |
          ZIP_NAME="${THEME_FOLDER}.${CURRENT_VERSION}.zip"

          rm -rf _artifact
          mkdir -p "_artifact/${THEME_FOLDER}"

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='vendor/' \
            --exclude='.gitignore' \
            --exclude='AGENTS.md' \
            --exclude='README.md' \
            --exclude='*.zip' \
            --exclude='_artifact/' \
            --exclude='_release/' \
            ./ "_artifact/${THEME_FOLDER}/"

          (cd _artifact && zip -r "../${ZIP_NAME}" "${THEME_FOLDER}")

          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

      - name: Upload ZIP as artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.THEME_SLUG }}-${{ env.BRANCH_SANITIZED }}
          path: ${{ env.ZIP_NAME }}

  release:
    name: Release theme
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Load theme config
        run: |
          set -a
          source .github/theme.config
          set +a

          : "${THEME_SLUG:?THEME_SLUG is required}"
          : "${THEME_FOLDER:=$THEME_SLUG}"
          : "${THEME_NAME:=$THEME_SLUG}"
          : "${THEME_MAIN_FILE:=style.css}"

          : "${UPDATES_PUBLIC_BASE_URL:?UPDATES_PUBLIC_BASE_URL is required}"
          : "${UPDATES_PATH:=$THEME_SLUG}"

          : "${UPDATES_SSH_HOST:?UPDATES_SSH_HOST is required}"
          : "${UPDATES_SSH_USER:?UPDATES_SSH_USER is required}"
          : "${UPDATES_SSH_BASE_PATH:?UPDATES_SSH_BASE_PATH is required}"

          echo "THEME_SLUG=$THEME_SLUG" >> "$GITHUB_ENV"
          echo "THEME_FOLDER=$THEME_FOLDER" >> "$GITHUB_ENV"
          echo "THEME_NAME=$THEME_NAME" >> "$GITHUB_ENV"
          echo "THEME_MAIN_FILE=$THEME_MAIN_FILE" >> "$GITHUB_ENV"

          echo "UPDATES_PUBLIC_BASE_URL=$UPDATES_PUBLIC_BASE_URL" >> "$GITHUB_ENV"
          echo "UPDATES_PATH=$UPDATES_PATH" >> "$GITHUB_ENV"
          echo "UPDATES_PUBLIC_URL=${UPDATES_PUBLIC_BASE_URL}/${UPDATES_PATH}" >> "$GITHUB_ENV"

          echo "UPDATES_SSH_HOST=$UPDATES_SSH_HOST" >> "$GITHUB_ENV"
          echo "UPDATES_SSH_USER=$UPDATES_SSH_USER" >> "$GITHUB_ENV"
          echo "UPDATES_SSH_BASE_PATH=$UPDATES_SSH_BASE_PATH" >> "$GITHUB_ENV"

          echo "REQUIRES_WP=${REQUIRES_WP:-}" >> "$GITHUB_ENV"
          echo "TESTED_WP=${TESTED_WP:-}" >> "$GITHUB_ENV"
          echo "REQUIRES_PHP=${REQUIRES_PHP:-}" >> "$GITHUB_ENV"
          echo "AUTHOR=${AUTHOR:-}" >> "$GITHUB_ENV"
          echo "AUTHOR_PROFILE=${AUTHOR_PROFILE:-}" >> "$GITHUB_ENV"
          echo "DESCRIPTION=${DESCRIPTION:-}" >> "$GITHUB_ENV"

      - name: Get current version
        run: |
          CURRENT_VERSION=$(grep -m1 '^Version:' "$THEME_MAIN_FILE" | grep -oP '\d+\.\d+\.\d+')

          if [ -z "$CURRENT_VERSION" ]; then
            echo "No version found in $THEME_MAIN_FILE"
            exit 1
          fi

          echo "CURRENT_VERSION=$CURRENT_VERSION" >> "$GITHUB_ENV"

      - name: Bump version
        run: |
          IFS='.' read -r major minor patch <<< "$CURRENT_VERSION"
          BRANCH="${{ github.event.pull_request.head.ref }}"

          if [[ "$BRANCH" == feature/* ]]; then
            minor=$((minor + 1))
            patch=0
          elif [[ "$BRANCH" == fix/* ]]; then
            patch=$((patch + 1))
          else
            echo "No version bump for branch: $BRANCH"
            echo "SKIP_RELEASE=true" >> "$GITHUB_ENV"
            exit 0
          fi

          NEW_VERSION="$major.$minor.$patch"

          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"

      - name: Update version in style.css
        if: env.SKIP_RELEASE != 'true'
        run: |
          sed -i "s/^Version: .*/Version: ${NEW_VERSION}/" "$THEME_MAIN_FILE"

      - name: Build release ZIP
        if: env.SKIP_RELEASE != 'true'
        run: |
          ZIP_NAME="${THEME_FOLDER}-v${NEW_VERSION}.zip"

          rm -rf _release
          mkdir -p "_release/${THEME_FOLDER}"

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='vendor/' \
            --exclude='.gitignore' \
            --exclude='AGENTS.md' \
            --exclude='README.md' \
            --exclude='*.zip' \
            --exclude='_release/' \
            --exclude='_artifact/' \
            ./ "_release/${THEME_FOLDER}/"

          (cd _release && zip -r "../${ZIP_NAME}" "${THEME_FOLDER}")

          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

      - name: Create update.json
        if: env.SKIP_RELEASE != 'true'
        run: |
          cat > update.json <<EOF
          {
            "theme": "${THEME_SLUG}",
            "name": "${THEME_NAME}",
            "version": "${NEW_VERSION}",
            "download_url": "${UPDATES_PUBLIC_URL}/${ZIP_NAME}",
            "details_url": "${UPDATES_PUBLIC_URL}/",
            "requires": "${REQUIRES_WP}",
            "tested": "${TESTED_WP}",
            "requires_php": "${REQUIRES_PHP}",
            "author": "${AUTHOR}",
            "author_profile": "${AUTHOR_PROFILE}",
            "last_updated": "$(date -u +%Y-%m-%d)",
            "description": "${DESCRIPTION}"
          }
          EOF

      - name: Setup SSH key
        if: env.SKIP_RELEASE != 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_ed25519

      - name: Add updates server to known_hosts
        if: env.SKIP_RELEASE != 'true'
        run: |
          ssh-keyscan -H "$UPDATES_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload update.json and ZIP to updates server
        if: env.SKIP_RELEASE != 'true'
        run: |
          REMOTE_DIR="${UPDATES_SSH_BASE_PATH}/${UPDATES_PATH}"

          ssh "${UPDATES_SSH_USER}@${UPDATES_SSH_HOST}" "mkdir -p '${REMOTE_DIR}'"

          scp update.json "${UPDATES_SSH_USER}@${UPDATES_SSH_HOST}:${REMOTE_DIR}/update.json"
          scp "${ZIP_NAME}" "${UPDATES_SSH_USER}@${UPDATES_SSH_HOST}:${REMOTE_DIR}/${ZIP_NAME}"

      - name: Commit and push version bump
        if: env.SKIP_RELEASE != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "$THEME_MAIN_FILE"
          git commit -m "Bump version to ${NEW_VERSION}" || echo "No changes to commit"

          git tag "v${NEW_VERSION}"
          git push origin main --tags

      - name: Create GitHub Release
        if: env.SKIP_RELEASE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${NEW_VERSION}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP_NAME" --clobber
          else
            gh release create "$TAG" "$ZIP_NAME" \
              --title "Release v${NEW_VERSION}" \
              --notes "Updated to version ${NEW_VERSION}"
          fi
